    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="930" cy="130" rx="350" ry="250" fill="url(#glow)"/>

    <circle cx="1010" cy="155" r="118" fill="none" stroke="#3B82F6" stroke-opacity=".16" stroke-width="1"/>
    <circle cx="1010" cy="155" r="88" fill="none" stroke="#60A5FA" stroke-opacity=".22" stroke-width="1"/>
    <circle cx="1010" cy="155" r="58" fill="none" stroke="#60A5FA" stroke-opacity=".16" stroke-width="1"/>

    <path d="M850 60 A145 145 0 0 1 1120 230"
