    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93C5FD" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect x="2" y="2" width="1196" height="316" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
